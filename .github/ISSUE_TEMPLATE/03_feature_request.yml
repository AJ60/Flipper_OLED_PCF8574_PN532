name: Feature Request
description: For feature requests regarding the DIY Flipper Zero (OLED Edition) firmware.
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out an issue. This template is meant for any feature suggestions for the **DIY Flipper Zero (OLED Edition)** firmware.
  - type: textarea
    id: proposal
    attributes:
      label: "Description of the feature you're suggesting."
      description: |
        Please describe your feature request in as many details as possible.
          - Describe what it should do.
          - Note whether it is to extend existing functionality or introduce new functionality.
          - If it is hardware-related (new module, peripheral, protocol), describe the hardware interface.
    validations:
      required: true
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Let us know if you have anything else to share (links, references, prior art, etc.)
