name: Bug report
description: File a bug report regarding the DIY Flipper Zero (OLED Edition) firmware.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report! This template is for issues related to the **DIY Flipper Zero (OLED Edition)** firmware and hardware.
        Please fill in as much detail as possible to help us reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug.
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: "How can this bug be reproduced?"
      placeholder: |
        1. Power on the device...
        2. Navigate to...
        3. Press button '...'
        4. Observe the issue
    validations:
      required: true
  - type: input
    id: firmware_version
    attributes:
      label: Firmware Version
      description: Which firmware version are you running? (Check the About screen or release tag)
      placeholder: "e.g. v2.2"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware Variant
      description: Which hardware are you using?
      placeholder: "e.g. WeAct STM32WB55CGU6 + SSD1306 OLED + PCF8574 + PN532"
  - type: textarea
    id: logs
    attributes:
      label: Logs / Serial Output
      description: Attach your debug logs or CLI serial output here (if applicable)
      render: Text
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Let us know if you have anything else to share (photos, oscilloscope traces, etc.)
