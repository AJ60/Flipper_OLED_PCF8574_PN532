name: "Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: "Install Build Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full python3-pip
          pip3 install --break-system-packages requests

      - name: "Build Firmware and Updater Package"
        run: |
          ./fbt COMPACT=1 DEBUG=0 --with-updater updater_package fap_dist

      - name: "Generate Release Notes from Template"
        run: |
          python3 .github/workflow_data/release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Collect Release Assets"
        run: |
          mkdir -p release_assets
          # Standalone firmware binaries
          cp -v build/f7-firmware-C/firmware.bin release_assets/flipper-z-f7-firmware-oled-${{ github.ref_name }}.bin || true
          cp -v build/f7-firmware-C/firmware.dfu release_assets/flipper-z-f7-firmware-oled-${{ github.ref_name }}.dfu || true
          cp -v build/f7-firmware-C/firmware.hex release_assets/flipper-z-f7-firmware-oled-${{ github.ref_name }}.hex || true
          # Standalone updater binaries
          cp -v build/f7-updater-C/updater.dfu release_assets/flipper-z-f7-updater-oled-${{ github.ref_name }}.dfu || true
          # qFlipper update packages
          cp -v dist/f7-C/*.tgz release_assets/ || true
          cp -v dist/f7-C/*.zip release_assets/ || true

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          name: "DIY Flipper Zero OLED Edition ${{ github.ref_name }}"
          body_path: .github/workflow_data/release.md
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
