name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Without a user token the release PR is opened by GITHUB_TOKEN, which triggers
          # no other workflow: the PR gets zero checks and branch protection blocks it
          # forever, waiting on a manual approval.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Rebase-merge the release PR once its required checks pass.
      - if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: gh pr merge --rebase --auto -R "$REPO" "$(echo "$PR_JSON" | jq -r .number)"

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-python@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          python-version: "3.x"

      - name: Build FAP
        if: ${{ steps.release.outputs.release_created }}
        run: |
          pip install ufbt
          ufbt

      - name: Upload FAP to release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} dist/sub_dup_finder.fap
